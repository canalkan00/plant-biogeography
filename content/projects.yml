featured:
  title:
    en: How Anatolian high-mountain plants responded to Quaternary climate change
    tr: Anadolu yüksek dağ bitkilerinin Kuvaterner iklim değişimlerine tepkisi
  text:
    en: Alpine crucifers whose ranges follow the Anatolian Diagonal and the Taurus Mountains, *Heldreichia bupleurifolia* (all six infraspecific taxa), *Noccaea oppositifolia* and *Phyllolepidium cyclocarpum* subsp. *cyclocarpum*, are studied with RADseq genomic data and ecological niche modelling. The project tests whether the glacial expansion–contraction model built for Europe and North America fits a landscape as complex as Anatolia, maps genomic hotspots (refugia), and uses *Arabidopsis thaliana* as the reference genome to look for genes behind adaptation to altitude, temperature and precipitation.
    tr: Yayılışı Anadolu Diyagonali ve Toros Dağları ile örtüşen alpin turpgiller, *Heldreichia bupleurifolia* (altı alttürün tamamı), *Noccaea oppositifolia* ve *Phyllolepidium cyclocarpum* subsp. *cyclocarpum*, RADseq genomik verisi ve ekolojik niş modellemesiyle çalışılıyor. Proje, Avrupa ve Kuzey Amerika için kurulan buzul dönemi genişleme–daralma modelinin Anadolu gibi karmaşık bir coğrafyaya uyup uymadığını test ediyor, genomik sıcak noktaları (refugia) belirliyor ve *Arabidopsis thaliana*'yı referans genom olarak kullanarak yükselti, sıcaklık ve yağışa uyumda rol oynayan genleri arıyor.
  meta:
    en: 'TÜBİTAK 1001 · 2021–2024 · Principal investigator: Prof. Dr. Barış Özüdoğru'
    tr: 'TÜBİTAK 1001 · 2021–2024 · Yürütücü: Prof. Dr. Barış Özüdoğru'
