featured:
- title:
    en: 'AlyDivEvo — Türkiye as a centre of plant diversity and evolution: European–Anatolian biogeographic connections'
    tr: 'AlyDivEvo — Bitki çeşitliliğinin ve evriminin merkezi olarak Türkiye: Avrupa–Anadolu biyocoğrafik bağlantıları'
  text:
    en: |-
      Using *Alyssum* (Brassicaceae) as a model system, this project investigates the evolutionary processes that have shaped plant diversity in Anatolia and Europe. It examines the roles of polyploidy, hybridisation, geographical isolation and ecological differentiation in plant diversification and speciation.

      By integrating phylogenomics (Hyb-Seq), population genomics (RADseq), flow cytometry, chromosome counting, morphometrics and ecological niche modelling, the project tests whether Anatolia has acted as a centre of diversification and a source of plant colonisation of Europe, or whether present-day diversity patterns reflect the fragmentation of formerly widespread ancestral lineages.
    tr: |-
      *Alyssum* (Brassicaceae) cinsini model sistem olarak kullanan bu proje, Anadolu'da ve Avrupa'da bitki çeşitliliğini biçimlendiren evrimsel süreçleri araştırıyor. Poliploidi, hibritleşme, coğrafi izolasyon ve ekolojik farklılaşmanın bitki çeşitlenmesi ve türleşmesindeki rolünü inceliyor.

      Filogenomik (Hyb-Seq), popülasyon genomiği (RADseq), akış sitometrisi, kromozom sayımı, morfometri ve ekolojik niş modellemesini bir araya getiren proje, Anadolu'nun bir çeşitlenme merkezi ve Avrupa'nın bitkilerle kolonizasyonunda bir kaynak olup olmadığını, yoksa bugünkü çeşitlilik örüntülerinin bir zamanlar geniş yayılışlı atasal soy hatlarının parçalanmasını mı yansıttığını test ediyor.
