name: Weekly citation update

on:
  schedule:
    - cron: "17 5 * * 1"   # Mondays 05:17 UTC (08:17 in Türkiye)
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update citation figures and check ORCID
        id: run
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python3 scripts/update_metrics.py

      - name: Rebuild index.html and commit
        if: always()
        run: |
          sh build.sh
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site.html *.html data/metrics.json
          if git diff --cached --quiet; then echo "No changes"; else
            git commit -m "Weekly citation update"
            git push
          fi

      - name: Open or update an issue for new ORCID works
        if: always() && hashFiles('new_publications.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Yeni yayın kontrolü / New publications to review"
          num=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')
          if [ -n "$num" ]; then gh issue edit "$num" --body-file new_publications.md
          else gh issue create --title "$title" --body-file new_publications.md; fi
