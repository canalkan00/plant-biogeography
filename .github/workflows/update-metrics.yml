name: Weekly citation and publication update

on:
  schedule:
    - cron: "17 5 * * 1"   # Mondays 05:17 UTC (08:17 in Türkiye)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  citations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Update citation figures from Google Scholar
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python3 scripts/update_metrics.py

      - name: Rebuild pages and commit
        if: always()
        run: |
          sh build.sh
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site.html *.html data/metrics.json
          if git diff --cached --quiet; then echo "No changes"; else
            git commit -m "Weekly citation update"
            git push
          fi

  new-publications:
    needs: citations
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Look for new journal articles on ORCID
        run: python3 scripts/new_publications.py

      - name: Propose them as a pull request
        if: hashFiles('pr_body.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch=auto/new-publications
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$branch"
          git add site.html
          git commit -m "Add new publications from ORCID"
          git push -f origin "$branch"
          num=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number')
          if [ -n "$num" ]; then gh pr edit "$num" --body-file pr_body.md
          else gh pr create --base main --head "$branch" --title "Yeni yayınlar / New publications" --body-file pr_body.md --assignee "${{ github.repository_owner }}"; fi
